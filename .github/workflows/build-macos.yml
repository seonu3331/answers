name: Build macOS app

on:
  push:
    branches: ["claude/admiring-hamilton-elmi1h", "main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon + macOS 26 (Tahoe) 전용 빌드
    runs-on: macos-26
    name: build (arm64, macOS 26)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .app
        run: PYTHON=python ./build_app.sh

      - name: Self-test bundled app
        run: |
          SCREENANSWER_SELFTEST=1 dist/ScreenAnswer.app/Contents/MacOS/ScreenAnswer
          codesign --verify --deep --strict dist/ScreenAnswer.app
          file dist/ScreenAnswer.app/Contents/MacOS/ScreenAnswer
          sw_vers

      - name: Capture backend check (informational)
        continue-on-error: true
        run: .venv/bin/python scripts/capture_check.py --no-save --x 400 --y 300

      - name: Package .dmg
        run: ./make_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenAnswer-arm64
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.dmg \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ScreenAnswer ${GITHUB_REF_NAME}" \
            --notes "Apple Silicon Mac (macOS 26) 전용"
